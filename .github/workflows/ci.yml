name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  release-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run test:release
        env:
          CG_RELEASE_TEST_DIR: ${{ runner.temp }}/release-tests
      - run: npm run release:check -- --dry-run
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          CG_BUILD_DIR: ${{ runner.temp }}/capability-graph-build
          CG_TEST_DIR: ${{ runner.temp }}/capability-graph-fixtures
          CG_ARTIFACTS_DIR: ${{ runner.temp }}/capability-graph-artifacts
      - run: npm run smoke:package
        env:
          CG_ARTIFACTS_DIR: ${{ runner.temp }}/capability graph 中文 artifacts
