name: validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    env:
      CG_BUILD_DIR: ${{ runner.temp }}/capability-graph-build
      CG_TEST_DIR: ${{ runner.temp }}/capability-graph-fixtures
      CG_ARTIFACTS_DIR: ${{ runner.temp }}/capability-graph-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run smoke:package
