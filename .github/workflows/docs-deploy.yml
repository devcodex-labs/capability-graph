name: Deploy documentation only

# Explicit opt-in; never publishes npm, creates a tag or deploys PR content.
on:
  workflow_dispatch:

concurrency:
  group: capability-graph-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.baseline.outputs.package_version }}
      release_tag: ${{ steps.baseline.outputs.release_tag }}
      release_commit: ${{ steps.baseline.outputs.release_commit }}
      documentation_commit: ${{ steps.baseline.outputs.documentation_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - id: baseline
        run: node website/scripts/check-docs-deployment.mjs
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run check:deployment && npm run check:types && npm run build && npm run build:ai && npm run test:site && npm run check:build && npm run check:package
        working-directory: website
        env:
          DEPLOYMENT_KIND: documentation
          RELEASE_TAG: ${{ steps.baseline.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.baseline.outputs.release_commit }}
          DOCS_COMMIT: ${{ steps.baseline.outputs.documentation_commit }}
      - run: node website/scripts/check-registry-install.mjs "$PACKAGE_VERSION"
        env:
          PACKAGE_VERSION: ${{ steps.baseline.outputs.package_version }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/doc_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
      DOCS_COMMIT: ${{ needs.build.outputs.documentation_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.documentation_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - name: Recheck package/main and prevent documentation rollback
        run: node website/scripts/check-docs-deployment.mjs && node website/scripts/check-pages-advance.mjs
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: node website/scripts/verify-public.mjs
