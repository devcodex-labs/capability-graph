name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "test/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/docs-deploy.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "website/**"
      - "src/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "test/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/docs-deploy.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

env:
  CG_ARTIFACTS_DIR: ${{ github.workspace }}/../capability-graph-artifacts
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../capability-graph-artifacts/browser-binaries

permissions:
  contents: read

jobs:
  docs-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: website
      - run: npm run generate
        working-directory: website
      - run: npm run check:content
        working-directory: website
      - run: npm run check:types
        working-directory: website
      - run: npm run check:deployment
        working-directory: website
      - run: npm run check:reference
        working-directory: website
      - run: npm run check:examples
        working-directory: website

  docs-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "24.19.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm run check:build
        working-directory: website

  docs-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
        working-directory: website
      - run: npm run test:site
        working-directory: website
      - run: npm run test:site:cross
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-browser-failure
          path: |
            ${{ github.workspace }}/../capability-graph-artifacts/website/playwright/
          retention-days: 7
