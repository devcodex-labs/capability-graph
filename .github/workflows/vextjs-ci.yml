name: VextJS fixed-source compatibility

on:
  push:
    paths: ['src/**', 'examples/**', 'scripts/**', 'test/**', 'package*.json', 'tsconfig*.json', '.github/workflows/vextjs-ci.yml']
  pull_request:
    paths: ['src/**', 'examples/**', 'scripts/**', 'test/**', 'package*.json', 'tsconfig*.json', '.github/workflows/vextjs-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-session:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19.0', '22.12.0', '24.19.0']
    env:
      VEXT_SOURCE_COMMIT: ef926649926e17543562b8169982fa1786285ecf
      VEXT_ROOT: ${{ runner.temp }}/capability-graph-vextjs-fixed
      CG_ARTIFACTS_DIR: ${{ github.workspace }}/../capability-graph-artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:tests
      - name: Fetch and verify the fixed framework source outside the project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VEXT_ROOT"
          git -C "$VEXT_ROOT" init --quiet
          git -C "$VEXT_ROOT" remote add origin https://github.com/devcodex-labs/vextjs.git
          git -C "$VEXT_ROOT" fetch --depth=1 origin "$VEXT_SOURCE_COMMIT"
          git -C "$VEXT_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$VEXT_ROOT" rev-parse HEAD)" = "$VEXT_SOURCE_COMMIT"
      - name: Install the framework's lockfile and build its actual CLI
        shell: bash
        run: npm ci --ignore-scripts --prefix "$VEXT_ROOT" && npm --prefix "$VEXT_ROOT" run build
      - name: Verify native catalog, retrieval and actual TCP Sessions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CG_ARTIFACTS_DIR/verification"
          node scripts/validation/vextjs-compatibility.mjs "$VEXT_ROOT" "$VEXT_SOURCE_COMMIT" > "$CG_ARTIFACTS_DIR/verification/vextjs-compatibility.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vextjs-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ env.CG_ARTIFACTS_DIR }}/verification/
          retention-days: 7
